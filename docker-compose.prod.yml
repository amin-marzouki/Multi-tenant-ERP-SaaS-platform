services:
  nginx:
    # Angular production build served by nginx, which also proxies /api to the backend.
    # TLS (port 443 + certificates) is not set up yet.
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orbiterp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: orbiterp
      SPRING_DATASOURCE_PASSWORD: orbiterp
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: orbiterp
      MYSQL_USER: orbiterp
      MYSQL_PASSWORD: orbiterp
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uorbiterp", "-porbiterp"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
