version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: orbiterp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: orbiterp
      MYSQL_USER: orbiterp
      MYSQL_PASSWORD: orbiterp
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: orbiterp-backend
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orbiterp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: orbiterp
      SPRING_DATASOURCE_PASSWORD: orbiterp
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orbiterp-frontend
    depends_on:
      - backend
    ports:
      - "4200:4200"

volumes:
  mysql_data:
