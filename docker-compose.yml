# Local development: MySQL, the backend with demo data, and the Angular dev server.
# Open http://localhost:4200 and sign in as described in backend/README.md.
services:
  mysql:
    image: mysql:8.0
    container_name: orbiterp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: orbiterp
      MYSQL_USER: orbiterp
      MYSQL_PASSWORD: orbiterp
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uorbiterp", "-porbiterp"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: orbiterp-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/orbiterp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: orbiterp
      SPRING_DATASOURCE_PASSWORD: orbiterp
      DEMO_DATA_ENABLED: "true"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orbiterp-frontend
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8080
    ports:
      - "4200:4200"

volumes:
  mysql_data:
