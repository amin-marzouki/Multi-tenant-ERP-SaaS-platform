server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the Spring Boot backend; keep the original Host so the
    # backend can resolve the tenant from the subdomain later.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular routes: fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
