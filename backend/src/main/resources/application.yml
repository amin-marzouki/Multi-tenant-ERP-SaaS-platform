spring:
  application:
    name: orbiterp-backend
  datasource:
    url: jdbc:mysql://localhost:3306/orbiterp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: orbiterp
    password: orbiterp
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: change-me-in-production
  expiration-ms: 3600000
