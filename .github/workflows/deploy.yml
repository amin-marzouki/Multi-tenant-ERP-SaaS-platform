name: OrbitERP CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build backend
        working-directory: backend
        run: gradle clean build --no-daemon

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

  # Pushes to main only: publish the images, then deploy them to the VPS
  publish-and-deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Name the images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_OWNER=$owner" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=ghcr.io/$owner/orbiterp-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/$owner/orbiterp-frontend" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push the frontend image (nginx)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # Needs the repository secrets VPS_HOST, VPS_USER, VPS_SSH_KEY, MYSQL_PASSWORD,
      # MYSQL_ROOT_PASSWORD and JWT_SECRET (BASE_DOMAIN is optional). Skipped until VPS_HOST is set.
      - name: Deploy to the VPS
        if: env.VPS_HOST != ''
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BASE_DOMAIN: ${{ secrets.BASE_DOMAIN }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          remote() { ssh -i "$HOME/.ssh/deploy_key" "$VPS_USER@$VPS_HOST" "$@"; }

          remote 'mkdir -p ~/orbiterp'
          scp -i "$HOME/.ssh/deploy_key" docker-compose.prod.yml "$VPS_USER@$VPS_HOST:~/orbiterp/docker-compose.prod.yml"

          # The .env file is written from GitHub secrets on every deploy and never committed
          printf 'IMAGE_OWNER=%s\nIMAGE_TAG=%s\nMYSQL_PASSWORD=%s\nMYSQL_ROOT_PASSWORD=%s\nJWT_SECRET=%s\nBASE_DOMAIN=%s\n' \
            "$IMAGE_OWNER" "$GITHUB_SHA" "$MYSQL_PASSWORD" "$MYSQL_ROOT_PASSWORD" "$JWT_SECRET" "$BASE_DOMAIN" \
            | remote 'umask 077 && cat > ~/orbiterp/.env'

          printf '%s' "$REGISTRY_TOKEN" | remote "docker login ghcr.io -u $REGISTRY_USER --password-stdin"
          remote 'cd ~/orbiterp && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --remove-orphans'

      - name: Deployment skipped
        if: env.VPS_HOST == ''
        run: echo "::notice::Images pushed to ghcr.io. Set the VPS_HOST secret (and the others) to deploy automatically."
