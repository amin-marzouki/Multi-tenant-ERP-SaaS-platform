name: OrbitERP CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build backend
        working-directory: backend
        run: gradle clean build --no-daemon

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Deploy to VPS
        run: |
          echo "Deploy step placeholder for VPS SSH + docker compose pull + docker compose up -d"
